name: Refresh watched routes
# Re-prices watched routes and sends due alert emails. Runs every 6 hours so the free
# Bright Data quota (5,000 credits/month) is not exhausted; the endpoint also caps work per run.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call refresh endpoint
        run: |
          curl --fail-with-body --max-time 90 -sS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron"
